<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Patient Viewer v2.1</title>

<style>
/* --- Core Layout --- */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  background: #f1f5f9;
  color: #334155;
  font-size: 14px; /* slightly bumped base */
}

header {
  background: #0f172a;
  color: white;
  padding: 18px 24px;
  font-size: 19px;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* --- File Input Area --- */
#fileBox {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 80vh;
  text-align: center;
}

#fileInput {
  padding: 22px;
  border: 2px dashed #cbd5e1;
  border-radius: 8px;
  background: white;
  margin-top: 20px;
  cursor: pointer;
}

/* --- Main App Grid --- */
#app {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: calc(100vh - 60px);
}

/* --- Sidebar --- */
#sidebar {
  background: white;
  border-right: 1px solid #e2e8f0;
  overflow-y: auto;
}

.patient-item {
  padding: 14px 18px;
  border-bottom: 1px solid #f1f5f9;
  cursor: pointer;
  transition: background 0.1s;
}

.patient-item:hover {
  background: #f8fafc;
  border-left: 4px solid #94a3b8;
}

.patient-item.active {
  background: #eff6ff;
  border-left: 4px solid #2563eb;
}

.p-id {
  font-weight: 700;
  font-size: 15px; /* bigger */
  color: #0f172a;
}

.p-meta {
  font-size: 12px;
  color: #64748b;
  margin-top: 4px;
}

/* --- Content Area --- */
#content {
  padding: 32px;
  overflow-y: auto;
}

/* --- Cards --- */
.card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  margin-bottom: 26px;
  overflow: hidden;
}

.card-header {
  padding: 16px 22px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  font-weight: 700;
  font-size: 15px; /* emphasized */
  color: #0f172a;
  display: flex;
  justify-content: space-between;
  cursor: pointer;
}

.card-header span {
  font-size: 13px;
  color: #64748b;
}

.card-body {
  padding: 22px;
}

.hidden { display: none !important; }

/* --- Tables --- */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px; /* bumped */
  margin: 12px 0 22px 0;
}

th, td {
  border: 1px solid #e2e8f0;
  padding: 10px 14px;
}

th {
  background: #f8fafc;
  color: #475569;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
}

td strong {
  font-size: 15px;
  color: #0f172a;
}

/* --- Section Labels --- */
.section-label {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: #475569;
  font-weight: 800;
  margin: 24px 0 12px 0;
  border-bottom: 2px solid #e2e8f0;
  padding-bottom: 6px;
}

/* --- Key Value Grid --- */
.kv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.kv-item {
  background: #f8fafc;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

.kv-key {
  font-size: 12px;
  color: #64748b;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-weight: 700;
}

.kv-val {
  font-size: 18px;        /* IMPORTANT: one-glance readable */
  font-weight: 700;
  color: #0f172a;
  word-break: break-word;
}

/* --- Findings / Tags --- */
.findings-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.finding-pill {
  font-size: 14px;
  padding: 7px 14px;
  border-radius: 999px;
  font-weight: 600;
}

.finding-positive {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #fecaca;
}

.finding-safe {
  background: #dcfce7;
  color: #166534;
  border: 1px solid #bbf7d0;
}

/* --- Text Blocks --- */
.text-block {
  background: #f8fafc;
  border-left: 4px solid #3b82f6;
  padding: 14px 16px;
  margin: 10px 0;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  color: #334155;
}

/* --- Badges --- */
.badge {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.badge-blue { background: #dbeafe; color: #1e40af; }

/* --- Loader --- */
#loading-overlay {
  position: absolute;
  top: 60px; left: 320px; right: 0; bottom: 0;
  background: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: #2563eb;
  font-weight: 700;
  z-index: 10;
}
</style>
</head>

<body>
<header>
  <div>Patient Data Viewer</div>
  <div style="font-size: 13px; font-weight: 400; opacity: 0.85">
    Memory Optimized
  </div>
</header>

<div id="fileBox">
  <h2>Select Patient JSON File</h2>
  <p style="color:#64748b">The file will be scanned for IDs, then memory cleared.<br>Data is re-read from disk upon patient selection.</p>
  <input type="file" id="fileInput" accept=".json">
</div>

<div id="app" class="hidden">
  <div id="sidebar"></div>
  <div id="content">
    <div style="color: #94a3b8; text-align: center; margin-top: 100px;">&larr; Select a patient to load data from disk</div>
  </div>
  <div id="loading-overlay" class="hidden">Reading file...</div>
</div>

<script>
// Global handles
let fileHandle = null;
let patientIndex = []; // Only stores ID and basic meta to save RAM

const dom = {
  fileInput: document.getElementById('fileInput'),
  fileBox: document.getElementById('fileBox'),
  app: document.getElementById('app'),
  sidebar: document.getElementById('sidebar'),
  content: document.getElementById('content'),
  loader: document.getElementById('loading-overlay')
};

// 1. Initial File Load (Scan for Keys only)
dom.fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  fileHandle = file;
  
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const fullData = JSON.parse(evt.target.result);
      
      // Extract ONLY metadata for sidebar, then nuke fullData
      patientIndex = Object.entries(fullData.subjects || {}).map(([id, subj]) => {
        // Detect available datasets
        const sets = [];
        if (subj.heart_dataset) sets.push('Heart');
        if (subj.microbiology_dataset) sets.push('Micro');
        
        let hasLab = false;
        let hasProc = false;
        
        if (subj.hadm_records_all) {
          Object.values(subj.hadm_records_all).forEach(rec => {
            if (rec.lab_dataset) hasLab = true;
            if (rec.procedure_dataset) hasProc = true;
          });
        }
        
        if (hasLab) sets.push('Lab');
        if (hasProc) sets.push('Proc');

        return { id, sets };
      });

      // Clear memory immediately
      fullData.subjects = null; 
      // Force GC hint (though JS engine decides)
      
      initSidebar();
      dom.fileBox.classList.add('hidden');
      dom.app.classList.remove('hidden');

    } catch (err) {
      alert("Error parsing JSON: " + err.message);
    }
  };
  reader.readAsText(file);
});

// 2. Sidebar Render
function initSidebar() {
  dom.sidebar.innerHTML = '';
  patientIndex.forEach(p => {
    const el = document.createElement('div');
    el.className = 'patient-item';
    el.innerHTML = `
      <div class="p-id">${p.id}</div>
      <div class="p-meta">${p.sets.join(', ') || 'No Data'}</div>
    `;
    el.onclick = () => loadPatientData(p.id);
    dom.sidebar.appendChild(el);
  });
}

// 3. Load Specific Patient (Re-read file)
function loadPatientData(targetId) {
  // UI updates
  document.querySelectorAll('.patient-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  dom.loader.classList.remove('hidden');

  // Read File Again
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const json = JSON.parse(evt.target.result);
      const subject = json.subjects[targetId];
      
      // Render
      renderPatient(targetId, subject);

      // Delete data again
      json.subjects = null;
      
      dom.loader.classList.add('hidden');
    } catch (err) {
      dom.content.innerHTML = `<div style="color:red">Error loading patient: ${err.message}</div>`;
      dom.loader.classList.add('hidden');
    }
  };
  reader.readAsText(fileHandle);
}

// 4. Main Rendering Logic
function renderPatient(id, data) {
  dom.content.innerHTML = `<h2 style="margin-top:0; border-bottom: 2px solid #e2e8f0; padding-bottom:15px;">Patient: ${id}</h2>`;

  if (!data) {
    dom.content.innerHTML += '<p>No data found for this ID in the file.</p>';
    return;
  }

  // --- 1. HEART DATASET ---
  if (data.heart_dataset) {
    dom.content.appendChild(renderHeartCard(data.heart_dataset));
  }

  // --- 2. MICROBIOLOGY DATASET ---
  if (data.microbiology_dataset) {
    dom.content.appendChild(renderMicroCard(data.microbiology_dataset));
  }

  // Check for Labs and Procedures inside hadm_records_all
  let labData = [];
  let procData = [];
  
  if (data.hadm_records_all) {
    Object.values(data.hadm_records_all).forEach(adm => {
      if (adm.lab_dataset) labData.push({ admId: adm.hadm_id, ...adm.lab_dataset });
      if (adm.procedure_dataset) procData.push({ admId: adm.hadm_id, ...adm.procedure_dataset });
    });
  }

  // --- 3. LAB DATASET ---
  if (labData.length > 0) {
    dom.content.appendChild(renderLabCard(labData));
  }

  // --- 4. PROCEDURE DATASET ---
  if (procData.length > 0) {
    dom.content.appendChild(renderProcCard(procData));
  }
  
  // Debug View (Optional, collapsible)
  const rawDiv = document.createElement('div');
  rawDiv.innerHTML = `<details style="margin-top: 30px; cursor:pointer; color:#94a3b8;"><summary>View Raw JSON</summary><pre style="font-size:10px; background:#e2e8f0; padding:10px; overflow:auto;">${JSON.stringify(data, null, 2)}</pre></details>`;
  dom.content.appendChild(rawDiv);
}

/* =========================================
   RENDERERS FOR SPECIFIC DATASETS
   ========================================= */

// --- HEART RENDERER ---
function renderHeartCard(d) {
  const card = createCard('Heart Dataset');
  let html = '';

  // Top Stats
  html += `<div class="kv-grid">
    ${kv('Records', d.n_records)}
    ${kv('Admissions', d.unique_admission_count)}
    ${kv('LVEF (Last)', d.vitals_summary?.lvef?.last)}
    ${kv('Diagnosis', (d.unique_diagnosis_titles || []).join(', '))}
  </div>`;

  // Physical Exam Findings (Clean Look)
  if (d.binary_findings_summary) {
    html += `<div class="section-label">Physical Findings</div>`;
    html += `<div class="findings-container">`;
    Object.entries(d.binary_findings_summary).forEach(([key, val]) => {
      // Logic: Only show keys ending in '_ever'
      if (key.endsWith('_ever')) {
        const label = key.replace('_ever', '').replace(/_/g, ' ');
        const isTrue = val === true;
        
        // Style: Red for true (finding present), Grey for false
        if (isTrue) {
             html += `<span class="finding-pill finding-positive">${label}</span>`;
        } else {
             // Optional: Uncomment to show negative findings
             // html += `<span class="finding-pill finding-neutral">${label} (Neg)</span>`;
        }
      }
    });
    // Fallback if no positive findings
    if (!html.includes('finding-positive')) {
        html += `<span class="finding-pill finding-safe">No significant positive findings recorded</span>`;
    }
    html += `</div>`;
  }

  // Vitals Summary Table
  if (d.vitals_summary) {
    html += `<div class="section-label">Vitals Summary</div>`;
    html += `<table><thead><tr>
      <th>Vital</th><th>Count</th><th>Min</th><th>Max</th><th>Mean</th><th>Last</th>
    </tr></thead><tbody>`;
    
    Object.entries(d.vitals_summary).forEach(([name, stats]) => {
      if(stats && stats.count !== undefined) {
        html += `<tr>
          <td>${name.replace('_summary','').toUpperCase().replace(/_/g, ' ')}</td>
          <td>${stats.count}</td>
          <td>${fmt(stats.min)}</td>
          <td>${fmt(stats.max)}</td>
          <td>${fmt(stats.mean)}</td>
          <td><strong>${fmt(stats.last)}</strong></td>
        </tr>`;
      }
    });
    html += `</tbody></table>`;
  }

  // Clinical Notes (from embedded hadm_records inside heart)
  if (d.hadm_records) {
    html += `<div class="section-label">Clinical Documentation</div>`;
    Object.entries(d.hadm_records).forEach(([admId, rec]) => {
      if (rec.text_fields) {
        html += `<div style="margin-bottom: 10px; font-weight:600; font-size:12px;">Admission: ${admId}</div>`;
        Object.entries(rec.text_fields).forEach(([type, texts]) => {
          if (texts && texts.length > 0) {
             html += `<div style="font-size:11px; font-weight:bold; color:#64748b; margin-top:8px;">${type}</div>`;
             html += `<div class="text-block">${texts[0]}</div>`;
          }
        });
      }
    });
  }

  card.body.innerHTML = html;
  return card.el;
}

// --- MICRO RENDERER ---
function renderMicroCard(d) {
  const card = createCard('Microbiology Dataset');
  let html = '';

  // Stats
  html += `<div class="kv-grid">
    ${kv('Total Tests', d.n_records)}
    ${kv('Start Date', d.first_test ? d.first_test.split('T')[0] : '-')}
    ${kv('End Date', d.last_test ? d.last_test.split('T')[0] : '-')}
    ${kv('Antibiotic Tests', d.n_ab_tests)}
  </div>`;

  // Lists of tags
  const renderList = (label, arr) => {
    if (!arr || arr.length === 0) return '';
    if (arr.length === 1 && arr[0] === "") return '';
    return `<div class="section-label">${label}</div>
            <div class="findings-container">
                ${arr.map(x => `<span class="badge badge-blue">${x}</span>`).join('')}
            </div>`;
  };

  html += renderList('Specimen Types', d.unique_spec_types);
  html += renderList('Organisms Detected', d.unique_organisms);
  html += renderList('Tests Performed', d.unique_tests);
  html += renderList('Antibiotics', d.unique_antibiotics);

  // Classifications
  html += `<div class="section-label">Test Classifications</div>`;
  html += `<div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size:12px;">`;
  
  const classificationKeys = ['anatomical_site', 'collection_invasiveness', 'sample_format', 'test_modality', 'target_organism_class', 'purpose_specific'];
  
  classificationKeys.forEach(k => {
      if(d[k] && d[k].length) {
          html += `<div><strong style="color:#64748b">${k.replace(/_/g, ' ')}:</strong> ${d[k].join(', ')}</div>`;
      }
  });
  html += `</div>`;

  // RSI stats
  if (d['rsi_counts_and_ratios_qc_ok_&_warn']) {
      const rsi = d['rsi_counts_and_ratios_qc_ok_&_warn'];
      if(rsi.R !== null || rsi.S !== null) {
          html += `<div class="section-label">Resistance Profile</div>`;
          html += `<div class="kv-grid">
            ${kv('Resistant (R)', rsi.R)}
            ${kv('Susceptible (S)', rsi.S)}
            ${kv('Intermediate (I)', rsi.I)}
          </div>`;
      }
  }

  card.body.innerHTML = html;
  return card.el;
}

// --- LAB RENDERER ---
function renderLabCard(labs) {
  const card = createCard('Laboratory Dataset');
  let html = '';
  
  labs.forEach(l => {
     html += `<div style="background:#f8fafc; padding:10px; border:1px solid #e2e8f0; margin-bottom:15px; border-radius:6px;">`;
     html += `<div style="font-weight:700; margin-bottom:8px; color:#334155;">Admission: ${l.admId}</div>`;
     
     // Stats row
     html += `<div class="kv-grid" style="grid-template-columns: repeat(4, 1fr); gap:5px; margin-bottom:10px;">
        ${kv('Total Tests', l.total_tests)}
        ${kv('Invalid Tests', l.n_invalid)}
        ${kv('Span (Days)', l.n_days_span)}
        ${kv('Glu Variance', fmt(l.glu_var))}
     </div>`;

     // Specific Lab Values Table
     html += `<table><thead><tr>
        <th>Test</th><th>Min</th><th>Max</th><th>N</th><th>Abnormal %</th>
     </tr></thead><tbody>`;

     const rows = [
         { k: 'K', label: 'Potassium' },
         { k: 'Na', label: 'Sodium' },
         { k: 'Cl', label: 'Chloride' },
         { k: 'Creat', label: 'Creatinine' },
         { k: 'Glu', label: 'Glucose' }
     ];

     rows.forEach(r => {
         const k = r.k.toLowerCase();
         // Check if data exists (e.g., k_min is present)
         if (l[`${k}_min`] !== undefined) {
             const abnRatio = l[`${k}_abnormal_ratio`];
             // Color code abnormal ratio
             let abnStyle = 'color: green';
             if(abnRatio > 0.3) abnStyle = 'color: orange; font-weight:bold';
             if(abnRatio > 0.7) abnStyle = 'color: red; font-weight:bold';

             html += `<tr>
                <td>${r.label}</td>
                <td>${fmt(l[`${k}_min`])}</td>
                <td>${fmt(l[`${k}_max`])}</td>
                <td>${l[`${k}_n`]}</td>
                <td style="${abnStyle}">${fmt(abnRatio * 100)}%</td>
             </tr>`;
         }
     });

     if (l.na_cl_ratio) {
        html += `<tr><td colspan="5" style="font-size:12px; color:#64748b; text-align:right;">Na/Cl Ratio: <strong>${fmt(l.na_cl_ratio)}</strong></td></tr>`;
     }

     html += `</tbody></table></div>`;
  });

  card.body.innerHTML = html;
  return card.el;
}

// --- PROCEDURES RENDERER ---
function renderProcCard(procs) {
  const card = createCard('Procedures Dataset');
  let html = '<table><thead><tr><th>Admission</th><th>Total Procs</th><th>Unique</th><th>Span (Days)</th></tr></thead><tbody>';
  
  procs.forEach(p => {
    html += `<tr>
        <td>${p.admId}</td>
        <td>${p.total_procedures}</td>
        <td>${p.unique_procedures}</td>
        <td>${p.n_days_span}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  card.body.innerHTML = html;
  return card.el;
}

/* =========================================
   UTILITIES
   ========================================= */

function createCard(title) {
  const el = document.createElement('div');
  el.className = 'card';
  
  const header = document.createElement('div');
  header.className = 'card-header';
  header.innerHTML = `${title} <span>▼</span>`;
  
  const body = document.createElement('div');
  body.className = 'card-body';
  
  // Collapse logic
  header.onclick = () => {
    body.classList.toggle('hidden');
    const arrow = header.querySelector('span');
    arrow.innerHTML = body.classList.contains('hidden') ? '►' : '▼';
  };

  el.appendChild(header);
  el.appendChild(body);
  
  return { el, body };
}

// Key-Value HTML Generator
function kv(label, value) {
  if (value === null || value === undefined) return '';
  return `<div class="kv-item"><div class="kv-key">${label}</div><div class="kv-val">${value}</div></div>`;
}

// Number formatter
function fmt(num) {
  if (num === null || num === undefined) return '-';
  if (typeof num === 'number') {
    // If integer, return as is. If float, fixed 2.
    return Number.isInteger(num) ? num : num.toFixed(2);
  }
  return num;
}

</script>
</body>
</html>
